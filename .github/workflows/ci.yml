name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # CI runs typecheck + lint only. It used to also run the full test suite,
    # but the suite's own growth (real glb imports/wiring, more full-mount
    # Babylon coverage, every Tokyo authenticity plan phase) started
    # outgrowing the GitHub-hosted runner's available memory: five straight
    # CI runs crashed with an unattributed vitest "Worker exited
    # unexpectedly" (no failing test, no stack trace, no heap-limit message —
    # consistent with a silent OS-level OOM-kill) at a consistent point in
    # the run, and it kept reproducing across several different fixes
    # (reduced worker count, isolating the heaviest single test into its own
    # step, vitest's own memory-limit/pool options). The tests themselves are
    # not the problem — they pass locally every time, repeatedly confirmed
    # during that investigation — so paying real CI minutes for an
    # environment-only failure was a bad trade. The owner's call: verify
    # locally (`npm test`, ~2 min and climbing with map size) before every
    # commit/merge instead, which is this repo's own established practice
    # anyway (CLAUDE.md).
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
