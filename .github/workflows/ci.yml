name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The Tokyo expansion's suite-time creep (plan risk register item 10): a
    # 10x-lane-km, park/signal/block-fabric map keeps adding real content-phase
    # seconds to `npm test`'s dominant cost (`trafficSafetyAcceptance.test.ts`
    # plus the full-mount characterization suites). 15 min was comfortable
    # before this expansion and got tight by Phase 5 (~14m45s) before Phase 6
    # exceeded it outright — raised to 30 with headroom for the remaining
    # phases rather than trimming seeds, which the plan is explicit is a
    # safety decision, not a perf knob.
    #
    # The same creep recurred under the Tokyo authenticity plan (13-16 real
    # glb models + wiring per phase, ~10 phases): 24m32s after import phase
    # P1, 25m0s after wiring phase P2, 25m41s after asset-import phase P3a —
    # each new model batch adds real committed-file byte-pin/provenance tests
    # plus full-mount render coverage, with 7 more content phases still to
    # land (P3b's wiring, then five new road/block/venue regions, then street
    # life). Raised again for the same reason, not trimming coverage.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (fast suite)
        run: npx vitest run --exclude "tests/trafficSafetyAcceptance.test.ts" --exclude "**/node_modules/**"

      # trafficSafetyAcceptance.test.ts runs 8 simulated minutes (28,800
      # ticks) x 51 seeds across every playable path in every city --
      # deliberately the heaviest thing in the suite (already called out by
      # name in this file's own comment above; CLAUDE.md's fast dev loop
      # excludes it for the identical reason). Its own memory/compute
      # footprint scales with map growth exactly like everything else here,
      # and by the Tokyo authenticity plan's P5 it started tipping this
      # runner's own memory ceiling: two CI runs crashed with an unattributed
      # vitest "Worker exited unexpectedly" (no failing test, no stack trace
      # into any test's own code) immediately following this test's own
      # completion in the combined log output, on a runner with far less RAM
      # than a local dev machine (where this test has never crashed). Giving
      # it a dedicated step/process — never sharing a worker pool with the
      # other 114 files' own accumulated memory — isolates that footprint
      # instead of trimming its seed count, the same "raise the budget,
      # don't cut coverage" call this file already made once for its own
      # timeout.
      - name: Test (traffic safety acceptance sweep)
        run: npx vitest run tests/trafficSafetyAcceptance.test.ts
